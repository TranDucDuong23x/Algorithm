name: Run algorithm test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: run testcase
      run: |
        g++ -std=c++17 "Bit Sequence/solution.cpp" -o solution

        # Testcase 1: Kiểm tra trực tiếp dữ liệu đầu vào và kết quả đầu ra
        echo "1010101" | ./solution > output.txt
        echo "3" | diff -w - output.txt

        # Testcase 2
        echo "00000000" | ./solution > output.txt
        echo "0" | diff -w - output.txt
      
